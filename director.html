<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandate - director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  body { overflow: auto; }
  .d { height: 100dvh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }

  .d-bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .d-bar h1 { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
  .d-bar .hint { font-size: 11.5px; color: var(--ink-3); }
  .timer { margin-left: auto; display: flex; align-items: baseline; gap: 8px; }
  .timer .now { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
  .timer .cap { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .timer.is-over .now { color: var(--stop); }

  .d-body { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 0; min-height: 0; }

  .beats { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 3px; }
  .beat-item { text-align: left; padding: 8px 10px; border-radius: 8px; display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: baseline; }
  .beat-item .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .beat-item .t { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
  .beat-item .at { font-family: var(--mono); font-size: 10px; color: var(--ink-3); grid-column: 2; }
  .beat-item:hover { background: rgba(255,255,255,.04); }
  .beat-item.is-on { background: var(--accent-dim); }
  .beat-item.is-on .t { color: var(--ink); font-weight: 500; }
  .beat-item.is-done .t { color: var(--ink-3); }

  .stage { overflow-y: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; }
  .kicker { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .stage h2 { font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -.022em; }

  .block { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--panel); }
  .block > .lbl { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .say { font-size: 16px; line-height: 1.62; color: var(--ink); }
  .say em { color: var(--accent); font-style: normal; font-weight: 500; }

  .prompt-row { display: flex; gap: 10px; align-items: flex-start; }
  .prompt { flex: 1; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .do { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
  .watch { font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .watch b { color: var(--ink); font-weight: 500; }

  .d-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .d-foot .keys { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
  kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--ink-2); }
  .live { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
  .live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .live.is-on .dot { background: var(--pass); }
</style>
</head>
<body>
<div class="d">

  <header class="d-bar">
    <h1>Director</h1>
    <span class="hint">Keep this window outside the recording area.</span>
    <div class="timer" id="timer"><span class="now" id="now">0:00</span><span class="cap">of 2:50</span></div>
  </header>

  <div class="d-body">
    <nav class="beats" id="beats" aria-label="Beats"></nav>
    <main class="stage" id="stage"></main>
  </div>

  <footer class="d-foot">
    <button class="btn btn-sm" id="prev">Back</button>
    <button class="btn btn-primary btn-sm" id="next">Next beat</button>
    <button class="btn btn-sm" id="startStop">Start timer</button>
    <span class="live" id="live"><span class="dot"></span><span id="liveText">Desk not connected</span></span>
    <span class="keys"><kbd>space</kbd> next &nbsp; <kbd>&larr;</kbd> back &nbsp; <kbd>c</kbd> copy prompt</span>
  </footer>
</div>

<script type="module" src="./src/director.js"></script>
</body>
</html>
